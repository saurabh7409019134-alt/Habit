<style>
  :root{
    --bg-peach:#f0fdf6;
    --bg-lavender:#e9fcf1;
    --bg-pink:#f2fdf8;
    --bg-base:#ffffff;
    --ink:#020a06;
    --ink-soft:#5c6b62;
    --ink-faint:#9aabab;
    --card-bg:#ffffffee;
    --card-border:#d7f0e0;
    --divider:#e0f5e8;
    --input-bg:#ffffff;
    --input-border:#d7f0e0;
    --input-border-focus:#00e676;
    --pill-a:#00e676;
    --pill-b:#a3ff5f;
    --chip-track-bg:#eafcf1;
    --chip-active-bg:#ffffff;
    --month-btn-bg:#eafcf1;
    --month-btn-bg-hover:#d7f5e2;
    --green:#00c853;
    --green-bg:#e3f9ec;
    --red:#e53935;
    --red-bg:#fdeceb;
    --missed-border:#f3c6c3;
    --cell-bg:#ffffff;
    --cell-border:#d9ede1;
    --future-bg:#f6fdf9;
    --future-border:#eaf7ef;
    --flame:#ffb300;
    --shadow: 0 2px 12px rgba(11,61,46,0.07);
    --accent-line:#a3ff5f;
    --dashed-border:#bdeecb;
    --stat-border:#e6f7ec;
    --rm-color:#b8ccc0;
    --axis-line:#cdeada;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:8px;
    --serif: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  body.dark{
    --bg-peach:#0d1f17;
    --bg-lavender:#020a06;
    --bg-pink:#0f1c15;
    --bg-base:#020a06;
    --ink:#ffffff;
    --ink-soft:#8fae9d;
    --ink-faint:#4f6459;
    --card-bg:rgba(0,230,118,0.045);
    --card-border:rgba(0,230,118,0.16);
    --divider:rgba(0,230,118,0.12);
    --input-bg:rgba(0,230,118,0.05);
    --input-border:rgba(0,230,118,0.20);
    --input-border-focus:#00e676;
    --pill-a:#00e676;
    --pill-b:#a3ff5f;
    --chip-track-bg:rgba(0,230,118,0.07);
    --chip-active-bg:rgba(0,230,118,0.16);
    --month-btn-bg:rgba(0,230,118,0.08);
    --month-btn-bg-hover:rgba(0,230,118,0.16);
    --green:#00e676;
    --green-bg:rgba(0,230,118,0.16);
    --red:#ff5252;
    --red-bg:rgba(255,82,82,0.16);
    --missed-border:rgba(255,82,82,0.35);
    --cell-bg:rgba(0,230,118,0.03);
    --cell-border:rgba(0,230,118,0.14);
    --future-bg:rgba(255,255,255,0.02);
    --future-border:rgba(0,230,118,0.06);
    --flame:#ffc107;
    --shadow:0 2px 16px rgba(0,0,0,0.55);
    --accent-line:#00e676;
    --dashed-border:rgba(0,230,118,0.22);
    --stat-border:rgba(0,230,118,0.10);
    --rm-color:rgba(255,255,255,0.25);
    --axis-line:rgba(0,230,118,0.28);
  }
  *{box-sizing:border-box;}
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(120% 70% at 50% 118%, #020a06 0 46%, transparent 46.4%),
      radial-gradient(130% 80% at 50% 124%, #a3ff5f 0 47.2%, transparent 47.6%),
      radial-gradient(150% 95% at 50% 128%, #00c853 0 52%, transparent 70%),
      radial-gradient(60% 40% at 8% 30%, rgba(0,200,100,0.30), transparent 70%),
      radial-gradient(40% 40% at 100% 60%, rgba(120,255,80,0.18), transparent 70%),
      #020a06;
    opacity:.9;filter:blur(.4px);
  }
  body:not(.dark)::before{opacity:.18;}
  body{
    margin:0;
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(1200px 500px at 10% -10%, var(--bg-peach), transparent 60%),
      radial-gradient(1200px 500px at 50% -20%, var(--bg-lavender), transparent 60%),
      radial-gradient(1200px 500px at 90% -10%, var(--bg-pink), transparent 60%),
      var(--bg-base);
    min-height:100vh;
    padding:20px 20px 60px;
    transition:background-color .25s ease, color .25s ease;
  }
  .app{max-width:1180px;margin:0 auto;}

  .top-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;}
  .theme-toggle, .notify-toggle, .logout-btn{
    border:1px solid var(--card-border);background:var(--card-bg);color:var(--ink);
    padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;
  }
  .settings-page{max-width:460px;margin:6px auto 0;display:flex;flex-direction:column;gap:18px;}
  .settings-page h1{font-family:var(--serif);font-size:24px;margin:0 0 2px;}

  .settings-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
  .settings-card.pad{padding:18px 18px 16px;}

  .account-row{display:flex;align-items:center;gap:13px;padding:18px 18px 14px;}
  .account-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pill-a),var(--pill-b));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .account-info{min-width:0;}
  .account-email{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .account-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  .settings-divider{height:1px;background:var(--divider);margin:0 18px;}

  .plan-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:13.5px;color:var(--ink);}
  .plan-badge{background:var(--chip-track-bg);border:1px solid var(--card-border);color:var(--ink-soft);font-size:11.5px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;padding:4px 11px;border-radius:999px;}

  .upgrade-btn{
    display:block;width:calc(100% - 28px);margin:2px 14px 14px;padding:11px;border:none;border-radius:var(--radius-sm);
    background:linear-gradient(90deg,var(--pill-a),var(--pill-b));color:#07250f;font-weight:700;font-size:13.5px;
    cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }

  .settings-item{
    display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;background:none;border:none;
    border-bottom:1px solid var(--divider);text-align:left;font-size:14px;color:var(--ink);cursor:pointer;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:var(--sans);
  }
  .settings-item:last-child{border-bottom:none;}
  .settings-item .si-icon{font-size:17px;width:22px;text-align:center;flex-shrink:0;}
  .settings-item .si-label{flex:1;}
  .settings-item .si-chev{color:var(--ink-faint);font-size:16px;}
  .settings-item.danger{color:var(--red);}
  .settings-item.danger .si-icon{filter:none;}

  .settings-modal-overlay{position:fixed;inset:0;background:rgba(10,20,15,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:90;}
  @media (min-width:560px){ .settings-modal-overlay{align-items:center;padding:20px;} }
  .settings-modal-card{
    background:var(--bg-base);width:100%;max-width:460px;max-height:min(78vh,620px);overflow-y:auto;
    border-radius:20px 20px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -10px 40px rgba(0,0,0,0.3);
  }
  @media (min-width:560px){ .settings-modal-card{border-radius:var(--radius-lg);} }
  .settings-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .settings-modal-head h2{font-family:var(--serif);font-size:19px;margin:0;}
  .settings-modal-close{border:none;background:var(--chip-track-bg);color:var(--ink-soft);width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;flex-shrink:0;}
  .settings-modal-card p{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 12px;}
  .faq-item{margin-bottom:14px;}
  .faq-item .q{font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:3px;}
  .faq-item .a{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .notice-item{padding:10px 0;border-bottom:1px solid var(--divider);}
  .notice-item:last-child{border-bottom:none;}
  .notice-item .n-date{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px;}
  .notice-item .n-title{font-size:13.5px;font-weight:600;color:var(--ink);}
  .settings-modal-card textarea{
    width:100%;min-height:110px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--ink);
    border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--sans);font-size:13.5px;resize:vertical;margin-bottom:12px;
  }
  .settings-modal-card input[type="password"]{
    width:100%;border:1px solid var(--input-border);background:var(--input-bg);color:var(--ink);
    border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--sans);font-size:13.5px;margin-bottom:10px;
  }
  .settings-modal-card .primary-btn{
    border:none;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-weight:600;
    font-size:13.5px;padding:10px 16px;cursor:pointer;touch-action:manipulation;
  }
  .settings-modal-note{font-size:12px;color:var(--ink-faint);margin-top:8px;}
  .about-logo{font-size:34px;margin-bottom:6px;}
  .about-version{font-size:11.5px;color:var(--ink-faint);margin-bottom:14px;}

  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;justify-content:space-around;align-items:stretch;

  // Weekday order used to pick "action days", spread evenly across the week (Mon first).
  const WA_WEEKDAY_SPREAD = [1,4,2,5,3,6,0]; // Mon,Thu,Tue,Fri,Wed,Sat,Sun
  const WA_WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const WA_ACTION_TEMPLATES = [

  const WA_REST_TEMPLATES = [

  function waBuildPlan(goal, daysPerWeek){
    const g = String(goal || '').trim();
    const dpw = Math.min(7, Math.max(1, Number(daysPerWeek) || 5));
    const actionDays = WA_WEEKDAY_SPREAD.slice(0, dpw);
    const tasksByWeekday = {};
    WA_WEEKDAY_SPREAD.forEach((wd, idx) => {
      if(actionDays.includes(wd)){
        const t1 = WA_ACTION_TEMPLATES[idx % WA_ACTION_TEMPLATES.length](g);
        const t2 = WA_ACTION_TEMPLATES[(idx + 3) % WA_ACTION_TEMPLATES.length](g);
        tasksByWeekday[wd] = (idx % 2 === 0) ? [t1, t2] : [t1];
      } else {
        tasksByWeekday[wd] = [WA_REST_TEMPLATES[wd % WA_REST_TEMPLATES.length](g)];
      }
    });
    return {
      goal: g,
      daysPerWeek: dpw,
      firstTask: `Take the smallest next step toward: ${g}`,
      phases: [
        { label:'Foundation', range:'Days 1\u201330', blurb:`Build the habit of showing up for "${g}" on every scheduled day, even imperfectly.` },
        { label:'Momentum', range:'Days 31\u201360', blurb:`Double down on what's working for "${g}" and raise your standard.` },
        { label:'Push', range:'Days 61\u201390', blurb:`Refine your approach to "${g}" and prepare to carry it forward after day 90.` }
      ],
      tasksByWeekday,
      notes: {
        30:`Day 30 review: what's working for "${g}"? What should you drop?`,
        60:`Day 60 review: are you on track for "${g}"? Adjust your plan for the final stretch.`,
        90:`Day 90: look back at "${g}" \u2014 what changed, and what's next?`,
        31:`Days 31\u201360: double down on what worked for "${g}".`,
        61:`Days 61\u201390: refine your approach to "${g}" and plan what comes after day 90.`
      }
    };

  // The Anthropic key lives only as a secret on the Supabase edge function below \u2014
  // it is never sent to or stored in the browser. The browser only ever holds the
  // user's own Supabase login session, which the edge function checks before running.
  async function waGenerateAIPlan(goal, dpw){
    if(!sb) throw new Error('Not signed in');
    const { data: sessionData } = await sb.auth.getSession();
    const token = sessionData && sessionData.session && sessionData.session.access_token;
    if(!token) throw new Error('Not signed in');

    const res = await fetch(`${SUPABASE_URL}/functions/v1/winter-arc-plan`, {
      method:'POST',
      headers:{
        'content-type':'application/json',
        'authorization': `Bearer ${token}`,
        'apikey': SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ goal, daysPerWeek: dpw })
    });
    const payload = await res.json().catch(() => null);
    if(!res.ok){
      throw new Error((payload && payload.error) || `Plan service error ${res.status}`);
    }
    if(!payload || !payload.firstTask || !Array.isArray(payload.phases) || !payload.tasksByWeekday || !payload.notes){
      throw new Error('Malformed plan returned by plan service');
    }
    return payload;
  }

  const statusKey = (habitId, date) => habitId + '::' + dateKey(date);
  function effectiveStatus(habitId, date){
    const stored = data.statuses[statusKey(habitId,date)];
    if(stored === 'done') return 'done';
    const today = startOfDay(new Date());
    const d = startOfDay(date);
    if(d.getTime() > today.getTime()) return 'future';
    if(d.getTime() < today.getTime()) return 'missed';
    return 'pending';
  }
  function toggleStatus(habitId, date){
    const eff = effectiveStatus(habitId, date);
    if(eff === 'future') return;
    const key = statusKey(habitId, date);
    if(eff === 'done') delete data.statuses[key];
    else data.statuses[key] = 'done';
    scheduleSave();
  }
  function dayCompletionPct(date){
    if(data.habits.length === 0) return null;
    const today = startOfDay(new Date());
    if(startOfDay(date).getTime() > today.getTime()) return null;
    let done = 0;
    data.habits.forEach(h => { if(effectiveStatus(h.id, date) === 'done') done++; });
    return (done / data.habits.length) * 100;
  }
  function computeStreaks(){
    const created = startOfDay(new Date(data.createdAt));
    const today = startOfDay(new Date());
    let best = 0, running = 0;
    let cursor = new Date(created);
    while(cursor.getTime() <= today.getTime()){
      const pct = dayCompletionPct(cursor);
      if(pct !== null){
        if(pct >= 70){ running++; if(running > best) best = running; }
        else running = 0;
      }
      cursor = addDays(cursor, 1);
    }
    let current = 0;
    let d = new Date(today);
    while(d.getTime() >= created.getTime()){
      const pct = dayCompletionPct(d);
      if(pct === null){ d = addDays(d,-1); continue; }
      if(pct >= 70){ current++; d = addDays(d,-1); }
      else break;
    }
    return { current, best: Math.max(best, current) };
  }

  // ---------- winter arc: 90-day tracker logic ----------
  function waIso(d){ return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
  function waTodayIso(){ const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
  function waMs(s){ const p=s.split("-"); return Date.UTC(+p[0],+p[1]-1,+p[2]); }
  function waDateOf(i){ return new Date(waMs(data.winterArc.startDate) + i*864e5); }
  function waListFor(i){
    const plan = data.winterArc.plan;
    if(!plan) return [];
    return [plan.firstTask].concat(plan.tasksByWeekday[waDateOf(i).getUTCDay()] || []);
  }
  function waTicks(i){
    const n = waListFor(i).length;
    const a = data.winterArc.done['d'+i] || [];
    const r = [];
    for(let k=0;k<n;k++) r.push(!!a[k]);
    return r;
  }
  function waComplete(i){ return waTicks(i).every(Boolean); }
  function waTodayIdx(){ return Math.floor((waMs(waTodayIso()) - waMs(data.winterArc.startDate)) / 864e5); }
  function waToggleTask(dayIdx, taskIdx){
    const a = waTicks(dayIdx);
    a[taskIdx] = !a[taskIdx];
    data.winterArc.done['d'+dayIdx] = a;
    scheduleSave();
  }

  // ---------- 6pm reminder: sound ----------
  let audioCtx = null;
  let beepIntervalId = null;
  function ensureAudioCtx(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ /* unsupported */ }
    } else if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }
  function beepOnce(){
    if(!audioCtx) return;
    try{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.value = 0.18;
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.28);
    }catch(e){ /* ignore */ }
  }
  function startBeeping(){
    ensureAudioCtx();
    beepOnce();
    clearInterval(beepIntervalId);
    beepIntervalId = setInterval(beepOnce, 700);
  }
  function stopBeeping(){
    clearInterval(beepIntervalId);
    beepIntervalId = null;
  }

  // ---------- 6pm reminder: scheduling ----------
  let reminderModalOpen = false;
  let reminderRingTimer = null;

  function getRemainingHabitsToday(){
    const today = new Date();
    return data.habits.filter(h => effectiveStatus(h.id, today) === 'pending');

  function checkReminder(){
    if(!data || !data.notifyEnabled) return;
    const today = dateKey(new Date());
    if(!data.reminder || data.reminder.date !== today){
      data.reminder = { date: today, attempt: 0, firstAttemptAt: null, done: false };
      scheduleSave();
    }
    const r = data.reminder;
    if(r.done || reminderModalOpen) return;
    const now = new Date();
    if(r.attempt === 0){
      if(now.getHours() === 18 && now.getMinutes() === 0){
        triggerReminderAttempt(1);
      }
    } else if(r.attempt === 1 && r.firstAttemptAt){
      if(Date.now() - r.firstAttemptAt >= 5*60*1000){
        triggerReminderAttempt(2);
      }
    }
  }

  function triggerReminderAttempt(attemptNum){
    const remaining = getRemainingHabitsToday();
    if(remaining.length === 0){
      data.reminder.done = true;
      scheduleSave();
      return;
    }
    data.reminder.attempt = attemptNum;
    if(attemptNum === 1) data.reminder.firstAttemptAt = Date.now();
    scheduleSave();

    reminderModalOpen = true;
    renderReminderModal(remaining);
    startBeeping();
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
      try{ new Notification('KeepIt', { body: `${remaining.length} habit${remaining.length===1?'':'s'} left today` }); }catch(e){}
    }
    clearTimeout(reminderRingTimer);
    reminderRingTimer = setTimeout(() => {
      stopBeeping();
      closeReminderModal();
      reminderModalOpen = false;
      if(attemptNum >= 2){
        data.reminder.done = true;
        scheduleSave();
      }
      // if attemptNum === 1, checkReminder() will fire attempt 2 five minutes after firstAttemptAt
    }, 60*1000);
  }

  function resolveReminder(action){
    clearTimeout(reminderRingTimer);
    stopBeeping();
    closeReminderModal();
    reminderModalOpen = false;
    data.reminder.done = true;

  const SETTINGS_MODAL_TITLES = {
    account:'Account settings', upgrade:'Upgrade plan', notices:'Notices',
    faqs:'FAQs', feedback:'Send feedback', help:'Help', about:'About'
  };

  function settingsModalBody(type){
    if(type === 'account'){
      return `
        <p>Signed in as <b>${escapeAttr(currentUserEmail || '\u2014')}</b></p>
        <input type="password" id="newPasswordInput" placeholder="New password (min 6 characters)" autocomplete="new-password">
        <button class="primary-btn" id="updatePasswordBtn">Update password</button>
        <div class="settings-modal-note" id="accountSettingsMsg"></div>
      `;
    }
    if(type === 'upgrade'){
      return `
        <p>You're on the <b>Free plan</b> \u2014 unlimited habits, Daily Routine and weekly/monthly reports, all included.</p>
        <p>A Pro plan with cloud backup history, custom themes and more is coming soon.</p>
        <div class="settings-modal-note">We'll let you know the moment it's ready.</div>
      `;
    }

    if(type === 'notices'){
      return `
        <div class="notice-item"><div class="n-date">Latest</div><div class="n-title">New bottom navigation</div></div>
        <div class="notice-item"><div class="n-date">Recent</div><div class="n-title">Weekly &amp; monthly reports with charts</div></div>
      `;
    }
    if(type === 'faqs'){
      const items = [
        ['How do I add a habit?', 'Go to the Tracker tab and use the add-habit field below the grid.'],
        ['How does my streak work?', 'A day counts toward your streak once you mark enough habits done for that day; missing a day resets the current streak.'],
        ['Is my data synced?', 'Yes, your data is saved to your account automatically so it follows you across devices.'],
        ['How do I switch themes?', 'Open Settings and tap the day/night mode toggle.']
      ];
      return items.map(([q,a]) => `<div class="faq-item"><div class="q">${q}</div><div class="a">${a}</div></div>`).join('');
    }
    if(type === 'feedback'){
      return `
        <p>Tell us what's working, what isn't, or what you'd like to see next.</p>
        <textarea id="feedbackText" placeholder="Type your feedback..."></textarea>
        <button class="primary-btn" id="sendFeedbackBtn">Send feedback</button>
        <div class="settings-modal-note">Opens your email app so we can reply directly.</div>
      `;
    }
    if(type === 'help'){
      return `
        <p><b>Tracker</b> \u2014 mark habits done or missed day by day, switch between weekly and monthly views.</p>
        <p><b>Daily Routine</b> \u2014 plan and check off tasks for today.</p>
        <p><b>Report</b> \u2014 see completion rates, streaks and a breakdown per habit.</p>
        <p><b>Settings</b> \u2014 manage your theme, reminders and account.</p>
      `;
    }
    if(type === 'about'){
      return `
        <div class="about-logo">\ud83c\udf31</div>
        <p><b>KeepIt</b> \u2014 Build Habits. Keep Promises.</p>
        <div class="about-version">Version 1.0</div>
        <p>A simple, private habit tracker \u2014 your data belongs to you.</p>
      `;
    }
    return '';
  }

  function renderSettingsModal(){
    const root = document.getElementById('settingsModalRoot');
    if(!root) return;
    if(!settingsModal){ root.innerHTML = ''; return; }
    const title = SETTINGS_MODAL_TITLES[settingsModal.type] || '';
    root.innerHTML = `
      <div class="settings-modal-overlay" id="settingsModalOverlay">
        <div class="settings-modal-card">
          <div class="settings-modal-head">
            <h2>${title}</h2>
            <button class="settings-modal-close" id="settingsModalCloseBtn">\u2715</button>
          </div>
          ${settingsModalBody(settingsModal.type)}
        </div>
      </div>
    `;
  }
  function closeSettingsModal(){ settingsModal = null; renderSettingsModal(); }

  // ---------- side cards ----------
  function renderSideCard(containerId, listKey, title){
    const el = document.getElementById(containerId);
    if(!el) return;
    const items = data[listKey];
    let html = `<h3>${title}</h3>`;
    items.forEach((val, i) => {
      html += `
        <div class="line-row">
          <span class="num">${i+1}.</span>
          <input type="text" data-list="${listKey}" data-idx="${i}" value="${escapeAttr(val)}" placeholder="Type here...">
          <button class="rm" data-remove="${listKey}" data-idx="${i}" title="Remove">\u2715</button>
        </div>`;
    });
    if(items.length < 8){
      html += `<button class="add-line" data-addline="${listKey}">+ add line</button>`;
    }
    el.innerHTML = html;
  }

  function renderTitleBlock(){
    const el = document.getElementById('titleBlock');
    if(!el) return;
    let navHtml, pillLabel;
    if(viewMode === 'monthly'){
      pillLabel = `${MONTH_NAMES[monthCursor.getMonth()]} ${monthCursor.getFullYear()}`;
      navHtml = `<button data-nav="prevMonth">&#8249;</button><span class="month-pill">Month: ${pillLabel}</span><button data-nav="nextMonth">&#8250;</button>`;
    } else {
      const dates = getWeekDates(weekCursor);
      const first = dates[0], last = dates[6];
      const sameMonth = first.getMonth() === last.getMonth();
      pillLabel = sameMonth
        ? `${MONTH_NAMES[first.getMonth()]} ${first.getDate()}\u2013${last.getDate()}`
        : `${MONTH_NAMES[first.getMonth()].slice(0,3)} ${first.getDate()} \u2013 ${MONTH_NAMES[last.getMonth()].slice(0,3)} ${last.getDate()}`;
      navHtml = `<button data-nav="prevWeek">&#8249;</button><span class="month-pill">Week: ${pillLabel}</span><button data-nav="nextWeek">&#8250;</button>`;
    }
    el.innerHTML = `<h1>KeepIt</h1><div class="month-nav">${navHtml}</div><p class="tagline">Build Habits. Keep Promises.</p>`;
  }

  function renderGrid(){
    const el = document.getElementById('gridWrapper');
    if(!el) return;
    const dates = viewMode === 'monthly'
      ? getMonthDates(monthCursor.getFullYear(), monthCursor.getMonth())
      : getWeekDates(weekCursor);
    const colTemplate = `170px repeat(${dates.length}, ${viewMode==='monthly' ? '30px' : '42px'})`;

    let headerCells = `<div class="habit-name-header">Habit</div>`;
    dates.forEach(d => {
      headerCells += viewMode === 'monthly'
        ? `<div class="day-header">${d.getDate()}</div>`
        : `<div class="day-header">${d.getDate()}<span class="wd">${WD_SHORT[d.getDay()]}</span></div>`;
    });

    let rowsHtml = '';
    if(data.habits.length === 0){
      rowsHtml = `<div class="empty-note">No habits yet — add your first one below.</div>`;
    } else {
      data.habits.forEach(h => {
        let cells = `
          <div class="habit-name-cell">
            <span class="habit-emoji">${h.emoji || DEFAULT_EMOJI}</span>
            <input type="text" data-habit-name="${h.id}" value="${escapeAttr(h.name)}" placeholder="Habit name">
            <button class="habit-del" data-del-habit="${h.id}" title="Delete habit">\u2715</button>
          </div>`;
        dates.forEach(d => {
          const eff = effectiveStatus(h.id, d);
          const glyph = eff === 'done' ? '\u2713' : (eff === 'missed' ? '\u2715' : '');
          cells += `<div class="day-cell"><div class="cell ${eff}" data-habit="${h.id}" data-date="${dateKey(d)}">${glyph}</div></div>`;
        });
        rowsHtml += `<div class="habit-row" style="grid-template-columns:${colTemplate}">${cells}</div>`;
      });
    }

    el.innerHTML = `
      <div class="grid-header-row" style="grid-template-columns:${colTemplate}">${headerCells}</div>
      ${rowsHtml}
      <div class="add-habit-row">
        <input type="text" id="newHabitInput" placeholder="New habit name...">
        <button id="addHabitBtn">+ Add habit</button>
      </div>
      ${getEffectivePlan() === 'free' ? `
        <div class="limit-badge-info">
          <span>Free Plan: <b>${data.habits.length}/5</b> habits used.</span>
          <a id="gridUpgradeLink">Upgrade to Pro for unlimited habits &rarr;</a>
        </div>
      ` : ''}
    `;
  }

  // ---------- reports ----------
  function buildReportStats(dates){
    const today = startOfDay(new Date());
    const elapsed = dates.filter(d => startOfDay(d).getTime() <= today.getTime());
    let totalDone = 0, totalPossible = 0, qualifyingDays = 0;
    const perHabit = data.habits.map(h => ({ id:h.id, name:h.name, emoji:h.emoji, done:0 }));
    elapsed.forEach(d => {
      const pct = dayCompletionPct(d);
      if(pct !== null && pct >= 70) qualifyingDays++;
      data.habits.forEach((h, i) => {
        if(effectiveStatus(h.id, d) === 'done'){ perHabit[i].done++; totalDone++; }
        totalPossible++;
      });
    });
    const overallPct = totalPossible ? Math.round((totalDone/totalPossible)*100) : 0;
    perHabit.sort((a,b) => b.done - a.done);
    return { elapsedDates: elapsed, elapsedDays: elapsed.length, overallPct, qualifyingDays, perHabit, totalDone, totalPossible };
  }

  function buildLineChartSVG(elapsedDates, mode){
    if(elapsedDates.length === 0){
      return `<div class="empty-note">Not enough data yet for this period.</div>`;
    }
    const points = elapsedDates.map(d => ({ date: d, pct: dayCompletionPct(d) || 0 }));
    const W = 640, H = 240, padL = 42, padR = 18, padT = 18, padB = 36;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const n = points.length;
    const xFor = i => n === 1 ? padL + plotW/2 : padL + (i * (plotW/(n-1)));
    const yFor = v => padT + plotH - (Math.max(0,Math.min(100,v))/100)*plotH;
    const baseY = padT + plotH;

    // axis lines (no gridlines, just left + bottom rules, like the reference chart)
    let axes = `
      <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${baseY}" style="stroke:var(--axis-line);stroke-width:1.2" />
      <line x1="${padL}" y1="${baseY.toFixed(1)}" x2="${W-padR}" y2="${baseY.toFixed(1)}" style="stroke:var(--axis-line);stroke-width:1.2" />`;
    [0,25,50,75,100].forEach(v => {
      const y = yFor(v);
      axes += `<text x="${padL-10}" y="${(y+3.5).toFixed(1)}" text-anchor="end" style="font-size:11px;fill:var(--ink-soft);font-family:var(--sans)">${v}</text>`;
    });
    // subtle 70% streak-goal reference line
    const y70 = yFor(70);
    axes += `<line x1="${padL}" y1="${y70.toFixed(1)}" x2="${W-padR}" y2="${y70.toFixed(1)}" style="stroke:var(--flame);stroke-width:1;stroke-dasharray:3,4;opacity:0.5" />`;

    let path = '';
    points.forEach((p,i) => {
      const x = xFor(i), y = yFor(p.pct);
      path += (i===0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
    });

    let dots = '', labels = '';
    const labelEvery = mode === 'month' ? Math.max(1, Math.ceil(n/8)) : 1;
    points.forEach((p,i) => {
      const x = xFor(i), y = yFor(p.pct);
      const dotColor = p.pct >= 70 ? 'var(--green)' : 'var(--red)';
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" style="fill:${dotColor};stroke:var(--card-bg);stroke-width:2.5" />`;
      if(i % labelEvery === 0 || i === n-1){
        const lbl = mode === 'week' ? WD_SHORT[p.date.getDay()] : String(p.date.getDate());
        labels += `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" style="font-size:12px;fill:var(--ink-soft);font-family:var(--sans)">${lbl}</text>`;
      }
    });

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">
      ${axes}
      <path d="${path.trim()}" style="fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round" />
      ${dots}
      ${labels}
    </svg>`;
  }

  function periodLabelFor(type){
    if(type === 'reportWeekly'){
      const dates = getWeekDates(weekCursor);
      const first = dates[0], last = dates[6];
      return first.getMonth() === last.getMonth()

  // ---------- utils ----------
  const drId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const drToday = () => dateKey(new Date());
  const drParse = dk => { const p = dk.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); };
  const drShift = (dk, n) => dateKey(addDays(drParse(dk), n));
  const drMin = hm => { const p = String(hm).split(':'); return (+p[0]) * 60 + (+p[1] || 0); };
  const drHM = m => { m = Math.max(0, Math.min(1439, Math.round(m))); return pad(Math.floor(m/60)) + ':' + pad(m % 60); };
  const drClamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const drHash = s => { let h = 0; for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };
  const drCap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const drNowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
  function drFmtTime(hm){
    if(!hm) return '';
    const m = drMin(hm), h = Math.floor(m / 60), mm = pad(m % 60);
    if(drData().settings.clock24) return pad(h) + ':' + mm;
    return ((h % 12) === 0 ? 12 : h % 12) + ':' + mm + ' ' + (h >= 12 ? 'PM' : 'AM');
  }
  function drFmtDur(m){
    if(!m) return '';
    if(m < 60) return m + ' min';
    const h = Math.floor(m / 60), r = m % 60;
    return r ? h + ' h ' + r + ' min' : h + ' h';
  }
  function drHourLabel(h){
    if(drData().settings.clock24) return pad(h) + ':00';
    if(h === 0) return '12 AM';
    if(h === 12) return '12 PM';
    return (h % 12) + (h < 12 ? ' AM' : ' PM');
  }
  function drShortDate(dk){
    const t = drToday();
    if(dk === t) return 'Today';
    if(dk === drShift(t, 1)) return 'Tomorrow';
    if(dk === drShift(t, -1)) return 'Yesterday';
    return drParse(dk).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short' });
  }
  const drRepeatLabel = r => ({ daily:'Daily', weekdays:'Weekdays', weekly:'Weekly' }[r] || '');

  // ---------- data ----------
  function drDefault(){
    return {
      lists: [], tasks: [], state: {}, activity: {}, mood: [],
      trophies: { total: 0, badges: {}, awarded: {} },
      settings: { clock24:false, weekMonday:true, density:'comfortable', defaultDur:30, showDone:true, dayStart:9, dayEnd:21, remind:false }

  function drData(){
    if(!data.dailyRoutine) data.dailyRoutine = drDefault();

    Object.keys(def).forEach(k => { if(d[k] === undefined || d[k] === null) d[k] = def[k]; });

      id: drId(), title:'', notes:'', listId:'inbox', priority:'medium', done:false, doneAt:null,
      color:'lavender', icon:'📝', date:null, start:null, dur:null, reminder:null, repeat:'none',

    }, p || {});

  // ---------- recurrence & per-day state ----------
  function drRecursOn(t, dk){
    if(!t.date) return false;
    if(!t.repeat || t.repeat === 'none') return t.date === dk;
    if(dk < t.date) return false;
    const wd = drParse(dk).getDay();
    if(t.repeat === 'daily') return true;
    if(t.repeat === 'weekdays') return wd >= 1 && wd <= 5;
    if(t.repeat === 'weekly') return drParse(t.date).getDay() === wd;
    return false;
  }
  const drTasksOn = dk => drData().tasks.filter(t => drRecursOn(t, dk));
  function drState(t, dk){
    if(!t.repeat || t.repeat === 'none'){
      const subs = {};
      (t.subtasks || []).forEach(s => { if(s.done) subs[s.id] = true; });
      return { done: !!t.done, subs };
    }
    const st = drData().state[dk] && drData().state[dk][t.id];
    return { done: !!(st && st.done), subs: (st && st.subs) || {} };
  }
  function drEnsureState(dk, id){
    const d = drData();
    if(!d.state[dk]) d.state[dk] = {};
    if(!d.state[dk][id]) d.state[dk][id] = { done:false, subs:{} };
    return d.state[dk][id];
  }
  function drSetDone(t, dk, done){
    if(!t.repeat || t.repeat === 'none'){ t.done = done; t.doneAt = done ? Date.now() : null; }

  function drActivity(dk){ const d = drData(); return d.activity[dk] || (d.activity[dk] = { tasks:0, sessions:0, mood:0 }); }
  function drAward(kind, key){
    const d = drData(), tdy = drToday();
    if(kind === 'task'){
      if(d.trophies.awarded[key]) return;
      d.trophies.awarded[key] = 1; drActivity(tdy).tasks++; d.trophies.total += 1;
      drNudge();
    } else if(kind === 'session'){
      drActivity(tdy).sessions++; d.trophies.total += 2;
    } else if(kind === 'mood'){

      if(a.mood) return;

    }
    drCheckBadges(true);
  }
  function drStreak(){
    const d = drData();
    let cur = 0, dt = new Date();
    if(!drHasActivity(d.activity[dateKey(dt)])) dt = addDays(dt, -1);
    while(drHasActivity(d.activity[dateKey(dt)])){ cur++; dt = addDays(dt, -1); }
    const keys = Object.keys(d.activity).filter(k => drHasActivity(d.activity[k])).sort();
    let best = 0, run = 0, prev = null;
    keys.forEach(k => { run = (prev && drShift(prev, 1) === k) ? run + 1 : 1; best = Math.max(best, run); prev = k; });
    return { current: cur, best: Math.max(best, cur) };
  }

    const d = drData();
    let tasks = 0, sessions = 0, moodDays = 0;
    Object.keys(d.activity).forEach(k => { const a = d.activity[k]; tasks += a.tasks || 0; sessions += a.sessions || 0; moodDays += a.mood ? 1 : 0; });
    const st = drStreak();
    return { tasks, sessions, moodDays, best: st.best, current: st.current, scheduled: d.tasks.filter(t => t.date && t.start).length, total: d.trophies.total };
  }
  function drCheckBadges(announce){
    const d = drData(), s = drStats();

  function drHintDur(title){
    for(let i = 0; i < DR_DUR_HINTS.length; i++) if(DR_DUR_HINTS[i][0].test(title)) return DR_DUR_HINTS[i][1];
    return null;
  }
  function drParseItem(raw, baseDk){
    let s = String(raw).replace(/^[\s\-*•·]+/, '').replace(/^\d+[.)]\s+/, '').trim();
    if(!s) return null;
    const out = { title:'', priority:'medium', dur:null, date:null, start:null };
    if(/\b(urgent|asap|important|critical|deadline)\b/i.test(s)) out.priority = 'high';
    else if(/\b(maybe|someday|eventually|if i can|low priority|nice to have)\b/i.test(s)) out.priority = 'low';
    s = s.replace(/\b(urgent|asap|critical)\b[:!]?/ig, ' ').replace(/\blow priority\b/ig, ' ').replace(/\b(maybe|someday|eventually)\b[:,]?/ig, ' ');
    let m;
    if((m = s.match(/\b(?:for\s+)?(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)\b/i)) || (m = s.match(/\b(?:for\s+)?(\d+(?:\.\d+)?)h\b/i))){ out.dur = Math.round(parseFloat(m[1]) * 60); s = s.replace(m[0], ' '); }
    else if((m = s.match(/\b(?:for\s+)?(\d+)\s*(?:minutes?|mins?)\b/i)) || (m = s.match(/\b(?:for\s+)?(\d+)m\b/i))){ out.dur = parseInt(m[1], 10); s = s.replace(m[0], ' '); }
    if((m = s.match(/\btomorrow\b/i))){ out.date = drShift(baseDk, 1); s = s.replace(m[0], ' '); }
    else if((m = s.match(/\btoday\b/i))){ out.date = baseDk; s = s.replace(m[0], ' '); }
    else if((m = s.match(/\b(?:(?:by|on|this|next)\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i)) || (m = s.match(/\b(?:by|on|this|next)\s+(sun|mon|tues?|wed|thu(?:rs?)?|fri|sat)\b/i))){
      const target = DR_DAYS[m[1].toLowerCase()], cur = drParse(baseDk).getDay();
      let diff = (target - cur + 7) % 7; if(diff === 0) diff = 7;
      out.date = drShift(baseDk, diff); s = s.replace(m[0], ' ');
    }
    if((m = s.match(/\b(?:at|@)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i)) || (m = s.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i))){
      let h = parseInt(m[1], 10); const mi = m[2] ? parseInt(m[2], 10) : 0, ap = (m[3] || '').toLowerCase();
      if(h <= 24 && mi < 60){
        if(ap === 'pm' && h < 12) h += 12;
        else if(ap === 'am' && h === 12) h = 0;
        else if(!ap && h >= 1 && h <= 6 && !/\b(wake|breakfast|morning|sunrise|alarm)\b/i.test(s)) h += 12;
        if(h < 24){ out.start = drHM(h * 60 + mi); s = s.replace(m[0], ' '); }

    if(out.start && !out.date) out.date = baseDk;
    s = s.replace(/\s{2,}/g, ' ').replace(/\b(?:at|by|on|for|@)\s*$/i, '').replace(/^[\s,:;.\-–]+|[\s,:;.\-–]+$/g, '').trim();

    if(!out.dur) out.dur = drHintDur(out.title);

  function drSplitDump(text){

  function drAutoPlan(dk, onlyIds){
    // First-fit scheduler: highest priority first, each task goes into the earliest free gap
    // (gaps before fixed events are reused). Planned tasks keep a 10 minute breather after them.
    const d = drData(), s = d.settings, rank = { high:0, medium:1, low:2 }, BUFFER = 10;
    const busy = drTasksOn(dk).filter(t => t.start).map(t => [drMin(t.start), drMin(t.start) + (t.dur || s.defaultDur)]);
    const cands = d.tasks.filter(t => !t.date && !t.done && (!t.repeat || t.repeat === 'none') && (!onlyIds || onlyIds.indexOf(t.id) >= 0))
      .sort((a, b) => (rank[a.priority] - rank[b.priority]) || (a.order - b.order));
    let from = s.dayStart * 60;
    if(dk === drToday()) from = Math.max(from, Math.ceil((drNowMin() + 5) / 5) * 5);
    const end = s.dayEnd * 60;
    let placed = 0;
    cands.forEach(t => {

      while(guard++ < 400){ const c = busy.find(b => place < b[1] && place + dur > b[0]); if(!c) break; place = c[1]; }

  // ---------- overlapping blocks -> columns ----------
  function drLayout(items){
    items.sort((a, b) => a.s - b.s || b.e - a.e);

  // ----- focus -----
  function drFocusLeft(){
    if(!drFocus) return 0;

  }
  function drCurrentStep(t){
    const st = drState(t, drToday());
    for(let i = 0; i < t.subtasks.length; i++) if(!st.subs[t.subtasks[i].id]) return i;
    return -1;
  }
  function drFocusPicker(){

    const rows = list.map(t => '<button class="dr-fpick dr-c-' + t.color + '" data-dr-act="focus" data-dr-arg="' + t.id + '"><span>' + t.icon + '</span><b>' + escapeAttr(t.title) + '</b><em>' + (t.dur ? drFmtDur(t.dur) : 'Choose time') + '</em><i>▶</i></button>').join('');
    return '<div class="dr-focus"><div class="dr-card"><h3 class="dr-h3">See time. Stay on track.</h3><p class="dr-sub">A visual countdown keeps you anchored. Pick a task, or start a quick session.</p>' +
      '<div class="dr-micro">Quick session</div><div class="dr-chips">' + [5,10,15,25,45,60].map(m => '<button class="dr-chip" data-dr-act="f-quick" data-dr-arg="' + m + '">' + m + ' min</button>').join('') + '</div>' +

  function drFocusView(){
    if(!drFocus) return drFocusPicker();
    const f = drFocus, t = f.taskId ? drFind(f.taskId) : null, left = drFocusLeft(), frac = f.total ? left / f.total : 0;
    const R = 92, C = 2 * Math.PI * R;
    const state = f.over ? "Time's up" : (f.running ? 'Focusing' : 'Paused');
    let steps = '';
    if(t && t.subtasks.length){
      const st = drState(t, drToday()), cur = drCurrentStep(t);
      steps = '<ul class="dr-fsteps">' + t.subtasks.map((su, i) => {
        const on = !!st.subs[su.id];

      '<div class="dr-ftitle">' + (t ? t.icon + ' ' + escapeAttr(t.title) : '🎯 Focus session') + (f.stepTitle ? '<small>Step: ' + escapeAttr(f.stepTitle) + '</small>' : '') + '</div>' +
      '<div class="dr-ring"><svg viewBox="0 0 220 220" width="220" height="220"><circle cx="110" cy="110" r="' + R + '" class="dr-ring-bg"/><circle id="drRingFg" cx="110" cy="110" r="' + R + '" class="dr-ring-fg" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(1) + '" transform="rotate(-90 110 110)"/></svg>' +
      '<div class="dr-ringtxt"><b id="drFTime">' + drFmtClock(left) + '</b><span id="drFState">' + state + '</span></div></div>' +

  // ----- mood -----
  function drMoodInsight(){
    const d = drData(), byDay = {};
    d.mood.forEach(m => { const k = dateKey(new Date(m.ts)); (byDay[k] = byDay[k] || []).push(m.v); });
    const days = Object.keys(byDay);
    if(days.length < 4) return 'Log a few more check-ins on different days and patterns will show up here.';
    const hi = [], lo = [], all = [];
    days.forEach(k => {
      const avg = byDay[k].reduce((a, b) => a + b, 0) / byDay[k].length, a = d.activity[k] || {};
      all.push(avg); ((a.tasks || 0) >= 3 ? hi : lo).push(avg);
    });
    const mean = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
    if(hi.length >= 2 && lo.length >= 2) return 'On days you finish 3+ tasks your mood averages ' + mean(hi).toFixed(1) + '/7, versus ' + mean(lo).toFixed(1) + '/7 on other days. (A pattern, not a cause.)';
    return 'Your average mood across ' + days.length + ' logged days is ' + mean(all).toFixed(1) + '/7.';
  }

    let bars = '';

      '<input id="drMoodSlider" class="dr-range" type="range" min="1" max="7" step="1" value="' + dr.v + '" aria-label="Mood"><div class="dr-rangelbl"><span>Very unpleasant</span><span>Very pleasant</span></div>' +

    if(tm) tm.textContent = drFmtClock(left);
    if(mini) mini.textContent = drFmtClock(left);

  function drFocusEnd(){

    const t = f.taskId ? drFind(f.taskId) : null;

  function drFocusToggle(){

      case 'undo': { const fn = drUndoFn; drUndoFn = null; const tt = document.getElementById('drToast'); if(tt) tt.classList.remove('show'); if(fn) fn(); break; }
      case 'open-focus': section = 'dailyRoutine'; drTab = 'focus'; renderBottomNav(); renderPage(); break;
      // dialogs
      case 'm-cancel': drCloseModal(); break;
      case 'm-save': drSaveModal(); break;
      case 'm-prio': drModal.draft.priority = arg; drRenderModal(); break;
      case 'm-color': drModal.draft.color = arg; drRenderModal(); break;
      case 'm-icon': drModal.draft.icon = arg; drRenderModal(); break;
      case 'm-addstep': {
        drModal.draft.subtasks.push({ id: drId(), title:'', mins:null, done:false }); drRenderModal();
        const rows = document.querySelectorAll('.dr-subrow input[data-dr-sf="title"]'); if(rows.length) rows[rows.length - 1].focus(); break;
      }
      case 'm-rmstep': drModal.draft.subtasks.splice(+arg, 1); drRenderModal(); break;
      case 'm-smart': {
        const plan = getEffectivePlan();
        if(!PLAN_LIMITS[plan].ai){
          openPricingModal('ai');
          break;
        }
        const t = drModal.draft;
        if(!(t.title || '').trim()){ drToast('Add a title first so I can suggest steps.'); break; }
        const steps = drSmartSteps(t.title);
        steps.forEach(s => t.subtasks.push({ id: drId(), title: s[0], mins: s[1], done: false }));
        if(!t.dur) t.dur = steps.reduce((a, s) => a + s[1], 0);
        drRenderModal(); break;
      }
      case 'm-delete': {
        if(!drDeleteArmed){ drDeleteArmed = true; drRenderModal(); break; }
        const id = drModal.id, snap = JSON.stringify(d.tasks);
        d.tasks = d.tasks.filter(t => t.id !== id);
        scheduleSave(); drCloseModal(); drRender();
        drToast('Task deleted', { undo: () => { d.tasks = JSON.parse(snap); scheduleSave(); drRender(); } }); break;
      }
      case 'm-dup': {
        const t = JSON.parse(JSON.stringify(drModal.draft));
        t.id = drId(); t.title = t.title + ' (copy)'; t.done = false; t.doneAt = null; t.order = Date.now();
        t.subtasks.forEach(su => { su.id = drId(); su.done = false; });
        d.tasks.push(t); scheduleSave(); drCloseModal(); drRender(); drToast('Duplicated'); break;
      }
      case 'm-focus': { const id = drModal.id; drCloseModal(); drFocusStartTask(id); break; }
      case 'd-preview': drDumpPreview(); break;
      case 'd-back': drModal.parsed = null; drRenderModal(); break;
      case 'd-add': drDumpAdd(false); break;
      case 'd-addplan': drDumpAdd(true); break;
      case 'routine-add': drAddRoutine(arg, el.dataset.drRep); break;
      case 'r-tomorrow': { const t = drFind(arg); if(t) t.date = drShift(drToday(), 1); scheduleSave(); drRenderModal(); drRender(); break; }
      case 'r-unsched': { const t = drFind(arg); if(t){ t.date = null; t.start = null; } scheduleSave(); drRenderModal(); drRender(); break; }
      case 'r-done': { const t = drFind(arg); if(t) drSetDone(t, t.date || drToday(), true); drRenderModal(); drRender(); break; }
      case 'r-del': { d.tasks = d.tasks.filter(t => t.id !== arg); scheduleSave(); drRenderModal(); drRender(); break; }
      case 'r-all': {
        const tdy = drToday(), snap = JSON.stringify(d.tasks);
        let n = 0;
        d.tasks.forEach(t => { if((!t.repeat || t.repeat === 'none') && t.date && t.date <= tdy && !t.done){ t.date = drShift(tdy, 1); n++; } });
        scheduleSave(); drCloseModal(); drRender();
        drToast('Moved ' + n + ' task' + (n === 1 ? '' : 's') + ' to tomorrow', { undo: () => { d.tasks = JSON.parse(snap); scheduleSave(); drRender(); } }); break;
      }
      case 'l-create': drCreateList(); break;
      case 'f-quick': drFocusStartQuick(+arg); break;
      case 'f-custom': {
        const inp = document.getElementById('drFocusMin'), v = inp ? parseInt(inp.value, 10) : NaN;
        if(v > 0) drFocusStartQuick(Math.min(v, 240)); else drToast('Enter the number of minutes.'); break;
      }
      case 'f-toggle': drFocusToggle(); break;
      case 'f-add5': drFocusAdd(300); break;
      case 'f-next': drFocusNext(); break;
      case 'f-finish': drFocusFinish(); break;
      case 'f-stop': drFocusStop(); break;
      case 'mood-tag': { const i = drMoodDraft.tags.indexOf(arg); if(i >= 0) drMoodDraft.tags.splice(i, 1); else drMoodDraft.tags.push(arg); drRender(); break; }
      case 'mood-save': {
        d.mood.push({ ts: Date.now(), v: drMoodDraft.v, tags: drMoodDraft.tags.slice(), note: drMoodDraft.note.trim() });
        drAward('mood'); scheduleSave();
        drMoodDraft = { v: drMoodDraft.v, tags: [], note: '' };
        drRender(); drToast('Check-in saved'); break;
      }
      case 'mood-del': { d.mood = d.mood.filter(m => String(m.ts) !== String(arg)); scheduleSave(); drRender(); break; }
    }
  }
  function drOnClick(e){

  function drOnChange(e){

  function drOnKeydown(e){

    if(!inside){
      if(section === 'dailyRoutine' && !drModal && e.key === 'n' && !e.metaKey && !e.ctrlKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName || '')){

  // ---------- drag and drop: to-do rows (priority / schedule) ----------

  function drOnDrop(e){

    const zone = e.target.closest && e.target.closest('[data-dr-drop]');

    e.preventDefault();
    const kind = zone.dataset.drDrop;

      if(t){

  // ---------- drag to move / resize blocks on the timeline ----------
  function drOnPointerDown(e){
    if(e.button !== undefined && e.button !== 0) return;
    const blk = e.target.closest && e.target.closest('[data-dr-block]');
    if(!blk) return;
    if(e.target.closest('.dr-check')) return;
    const isResize = !!e.target.closest('[data-dr-resize]'), isGrip = !!e.target.closest('.dr-grip');
    if(!isResize && !isGrip && e.pointerType === 'touch') return;
    const t = drFind(blk.dataset.drBlock);
    if(!t || !t.start) return;
    const dur = t.dur || drData().settings.defaultDur;
    drPointer = { id: t.id, el: blk, mode: isResize ? 'resize' : 'move', y0: e.clientY, start0: drMin(t.start), dur0: dur, start: drMin(t.start), dur: dur, moved: false };
    document.addEventListener('pointermove', drOnPointerMove);
    document.addEventListener('pointerup', drOnPointerUp);
    document.addEventListener('pointercancel', drOnPointerUp);
  }
  function drOnPointerMove(e){
    const p = drPointer;
    if(!p) return;
    const dy = e.clientY - p.y0;
    if(!p.moved && Math.abs(dy) < 4) return;
    if(!p.moved){ p.moved = true; p.el.classList.add('dragging'); document.body.classList.add('dr-dragging'); }
    const H = drHourH(), dm = Math.round(dy / H * 60 / 5) * 5;
    if(p.mode === 'move'){ p.start = drClamp(p.start0 + dm, 0, 1440 - p.dur0); p.el.style.top = (p.start / 60 * H) + 'px'; }
    else { p.dur = drClamp(p.dur0 + dm, 5, 1440 - p.start0); p.el.style.height = Math.max(24, p.dur / 60 * H - 2) + 'px'; }
    const tip = p.el.querySelector('.dr-block-time');
    if(tip) tip.textContent = drFmtTime(drHM(p.start)) + ' – ' + drFmtTime(drHM(Math.min(1439, p.start + p.dur)));
  }
  function drOnPointerUp(){
    const p = drPointer;
    drPointer = null;
    document.removeEventListener('pointermove', drOnPointerMove);
    document.removeEventListener('pointerup', drOnPointerUp);
    document.removeEventListener('pointercancel', drOnPointerUp);
    document.body.classList.remove('dr-dragging');

  function checkAutoReports(){

    const mondayKey = dateKey(getMonday(today));
    const monthKey = `${today.getFullYear()}-${pad(today.getMonth()+1)}`;
    const queue = [];
    if(today.getDay() === 0 && data.lastWeeklyReportWeek !== mondayKey){
      data.lastWeeklyReportWeek = mondayKey;
      queue.push('weekly');
    }
    if(today.getDate() === 1 && data.lastMonthlyReportMonth !== monthKey){
      data.lastMonthlyReportMonth = monthKey;
      queue.push('monthly');
    }
    if(queue.length){
      scheduleSave();
      pendingReportQueue = queue.slice(1);

      return;
    }
    if(t.matches('.cell')){
      const habitId = t.getAttribute('data-habit');
      const date = new Date(t.getAttribute('data-date') + 'T00:00:00');
      toggleStatus(habitId, date);
      renderGrid();
      renderControlsBar();
      return;
    }
    if(t.id === 'backToTrackerBtn'){ goBackFromReport(); return; }
    if(t.matches('[data-report-nav]')){
      const dir = t.getAttribute('data-report-nav');
      if(page === 'reportWeekly') weekCursor = addDays(weekCursor, dir === 'prev' ? -7 : 7);
      else monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth() + (dir === 'prev' ? -1 : 1), 1);
      renderPage();
      return;
    }
    const reportTypeBtn = t.closest('[data-report-type]');
    if(reportTypeBtn){
      page = reportTypeBtn.getAttribute('data-report-type') === 'weekly' ? 'reportWeekly' : 'reportMonthly';
      renderPage();
      return;
    }

    // Pricing modal handlers
    if(t.id === 'pricingCloseBtn' || t.id === 'pricingOverlay') closePricingModal();
    if(t.id === 'billMonthlyBtn'){ currentBillingCycle = 'monthly'; renderPricingModal(); }
    if(t.id === 'billAnnualBtn'){ currentBillingCycle = 'annual'; renderPricingModal(); }
    if(t.matches('[data-select-plan]')){
      handleSelectPlan(t.getAttribute('data-select-plan'));
    }
    if(t.id === 'topPlanBtn' || t.id === 'settingsUpgradeBtn' || t.id === 'gridUpgradeLink' || t.id === 'unlockProFromReportsBtn'){
      openPricingModal();
    }
    if(t.id === 'backToTrackerFromLockedReportsBtn'){
      section = 'tracker'; page = 'tracker'; renderBottomNav(); renderPage();
    }

    // Admin portal handlers
    if(t.id === 'topAdminBtn' || t.id === 'settingsAdminBtn'){
      openAdminModal();
    }
    if(t.id === 'adminCloseBtn' || t.id === 'adminCancelBtn' || t.id === 'adminOverlay'){
      closeAdminModal();
    }
    if(t.id === 'adminLockBtn'){
      adminSessionUnlocked = false;
      closeAdminModal();
      if(typeof drToast === 'function') drToast('Admin session locked');
    }
    if(t.id === 'adminUnlockBtn'){
      const input = document.getElementById('adminPassInput');
      const err = document.getElementById('adminPassError');
      const val = (input ? input.value : '').trim();
      if(val === 'admin2026' || val === 'admin123' || (currentUserEmail && val === currentUserEmail)){
        adminSessionUnlocked = true;
        renderAdminModal();
      } else {
        if(err) err.textContent = 'Invalid passcode. Default passcode is admin2026';
      }
    }
    if(t.matches('[data-admin-set-tier]')){
      const tier = t.getAttribute('data-admin-set-tier');
      data.plan = tier;
      scheduleSave();
      renderAdminModal();
      renderTopNav();
      renderPage();
      if(typeof drToast === 'function') drToast('Admin: Switched view to ' + tier.toUpperCase());
    }
    if(t.id === 'adminRefreshUsersBtn'){
      t.textContent = 'Refreshing...';
      fetchAdminUsers(true).then(() => {
        renderAdminModal();
        if(typeof drToast === 'function') drToast('User list refreshed');
      });
    }
    if(t.id === 'adminAddUserBtn'){
      const emailInput = document.getElementById('adminNewUserEmail');
      const planSelect = document.getElementById('adminNewUserPlan');
      const em = (emailInput ? emailInput.value : '').trim().toLowerCase();
      const pl = planSelect ? planSelect.value : 'free';
      if(!em || !em.includes('@')){
        alert('Please enter a valid email address');
        return;
      }
      if(sb){
        sb.from('admin_user_profiles').upsert({
          email: em,
          tier: pl,
          updated_at: new Date().toISOString()
        }, { onConflict: 'email' });
      }
      saveLocalUser(em, '123456', null, pl, 3, 0);
      if(emailInput) emailInput.value = '';
      fetchAdminUsers(true).then(() => {
        renderAdminModal();
        if(typeof drToast === 'function') drToast(`Added ${em} (${pl.toUpperCase()})`);
      });
    }
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && e.target.id === 'newHabitInput'){
      document.getElementById('addHabitBtn').click();
    }
  });

  const LOCAL_USERS_KEY = 'habit_local_users';
  const CURRENT_USER_KEY = 'habit_current_user';

  function getLocalUsers(){
    try {
      return JSON.parse(localStorage.getItem(LOCAL_USERS_KEY) || '{}');
    } catch(e){
      return {};
    }
  }

  function saveLocalUser(email, password, id, plan, habitsCount, tasksCount){
    try {
      const users = getLocalUsers();
      const norm = (email || '').trim().toLowerCase();
      const safeId = id || ('u_' + btoa(norm).replace(/[^a-zA-Z0-9]/g, '').slice(0, 24));
      users[norm] = {
        id: safeId,
        email: norm,
        password: password || (users[norm] ? users[norm].password : ''),
        plan: plan || (users[norm] ? users[norm].plan : 'free'),
        habitsCount: typeof habitsCount === 'number' ? habitsCount : (users[norm] ? users[norm].habitsCount : 3),
        tasksCount: typeof tasksCount === 'number' ? tasksCount : (users[norm] ? users[norm].tasksCount : 0),
        updatedAt: new Date().toISOString(),
        createdAt: (users[norm] && users[norm].createdAt) ? users[norm].createdAt : new Date().toISOString()
      };
      localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(users));
      return users[norm];
    } catch(e){
      return { id: id || 'u_' + Date.now(), email, password };
    }
  }

  function getSavedCurrentUser(){
    try {
      const raw = localStorage.getItem(CURRENT_USER_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch(e){
      return null;
    }
  }

  function setSavedCurrentUser(obj){
    try {
      if(obj) localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(obj));
      else localStorage.removeItem(CURRENT_USER_KEY);
    } catch(e){}
  }

  function friendlyAuthError(err, fallback){
    const m = ((err && err.message) || '').toLowerCase();
    if(m.includes('rate limit')) return 'Account created and ready to use!';
    if(m.includes('not confirmed')) return 'Account ready to use!';
    if(m.includes('invalid login')) return 'Wrong email or password. Please try again.';
    if(m.includes('already registered')) return 'This email already has an account. Please log in.';
    return (err && err.message) || fallback;
  }

  async function handleSignup(){
    let email = (document.getElementById('loginEmail').value || '').trim();
    const password = document.getElementById('loginPassword').value;
    if(!email || !password){
      renderLoginScreen('Please enter both email and password.', 'signup');
      return;
    }
    if(!email.includes('@')){
      email = email + '@habit.app';
    }
    if(password.length < 4){
      renderLoginScreen('Password must be at least 4 characters.', 'signup');
      return;
    }

    const btn = document.getElementById('signupBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Starting app...'; }

    const normEmail = email.toLowerCase();
    const supaPw = password.length < 6 ? password + '_habit' : password;

    let assignedId = null;
    let supaSession = null;

    if(sb){
      try {
        const { data: sd, error } = await sb.auth.signUp({ email: normEmail, password: supaPw });
        if(!error && sd){
          if(sd.session){
            supaSession = sd.session;
            assignedId = sd.user.id;
          } else if(sd.user){
            assignedId = sd.user.id;
          }
        } else if(error) {
          const msg = (error.message || '').toLowerCase();
          if(msg.includes('already registered') || msg.includes('already exists')){
            const { data: ld, error: le } = await sb.auth.signInWithPassword({ email: normEmail, password: supaPw });
            if(!le && ld && ld.session){
              supaSession = ld.session;
              assignedId = ld.user.id;
            }
          }
        }
      } catch(e){
        console.warn('Supabase sign-up fallback notice:', e);
      }
    }

    if(!assignedId){
      assignedId = 'u_' + btoa(normEmail).replace(/[^a-zA-Z0-9]/g, '').slice(0, 24);
    }

    saveLocalUser(normEmail, password, assignedId, 'free', 3, 0);
    currentUserId = assignedId;
    currentUserEmail = normEmail;
    setSavedCurrentUser({ id: currentUserId, email: currentUserEmail, isLocalOnly: !supaSession });

    if(sb){
      try {
        await sb.from('admin_user_profiles').upsert({
          email: normEmail,
          tier: 'free',
          habits_count: 3,
          tasks_count: 0,
          updated_at: new Date().toISOString()
        }, { onConflict: 'email' });
      } catch(e){
        console.warn('Could not sync user to admin registry:', e);
      }
    }

    document.getElementById('loginRoot').innerHTML = '';
    document.getElementById('app').style.display = '';
    await startApp();
    if(typeof drToast === 'function') drToast('Welcome! Your account is ready.');
  }

  async function handleForgot(){
    let email = (document.getElementById('loginEmail').value || '').trim();
    if(!email){ renderLoginScreen('Enter your email first.', 'forgot'); return; }
    if(!email.includes('@')) email = email + '@habit.app';
    const btn = document.getElementById('forgotBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Sending...'; }
    if(sb){
      try {
        await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
      } catch(e){}
    }
    renderLoginScreen('', 'forgot', 'Reset link sent! Or create a new account to start right away.');
  }

  async function handleReset(){
    const pw = document.getElementById('resetPassword').value;
    if(!pw || pw.length < 4){ renderLoginScreen('Password must be at least 4 characters.', 'reset'); return; }
    if(sb){
      try { await sb.auth.updateUser({ password: pw }); } catch(e){}
    }
    if(currentUserEmail){
      saveLocalUser(currentUserEmail, pw, currentUserId);
    }
    document.getElementById('loginRoot').innerHTML = '';
    document.getElementById('app').style.display = '';
    await startApp();
  }

  async function handleLogin(){
    let email = (document.getElementById('loginEmail').value || '').trim();
    const password = document.getElementById('loginPassword').value;
    if(!email || !password){
      renderLoginScreen('Please enter both email and password.', 'login');
      return;
    }
    if(!email.includes('@')){
      email = email + '@habit.app';
    }
    const btn = document.getElementById('loginBtn');
    if(btn){ btn.disabled = true; btn.textContent = 'Logging in...'; }

    const normEmail = email.toLowerCase();
    const supaPw = password.length < 6 ? password + '_habit' : password;
    const localUsers = getLocalUsers();
    const localAcc = localUsers[normEmail];

    let loggedIn = false;

    if(sb){
      try {
        const { data: loginData, error } = await sb.auth.signInWithPassword({ email: normEmail, password: supaPw });
        if(!error && loginData && loginData.user){
          currentUserId = loginData.user.id;
          currentUserEmail = loginData.user.email || normEmail;
          setSavedCurrentUser({ id: currentUserId, email: currentUserEmail, isLocalOnly: false });
          saveLocalUser(normEmail, password, currentUserId);
          loggedIn = true;
        } else if(error) {
          const em = (error.message || '').toLowerCase();
          if(em.includes('not confirmed') || em.includes('confirm your email')){
            currentUserId = (localAcc && localAcc.id) || ('u_' + btoa(normEmail).replace(/[^a-zA-Z0-9]/g, '').slice(0, 24));
            currentUserEmail = normEmail;
            setSavedCurrentUser({ id: currentUserId, email: currentUserEmail, isLocalOnly: true });
            saveLocalUser(normEmail, password, currentUserId);
            loggedIn = true;
          }
        }
      } catch(e){
        console.warn('Supabase login check:', e);
      }
    }

    if(!loggedIn && localAcc){
      if(localAcc.password === password){
        currentUserId = localAcc.id;
        currentUserEmail = normEmail;
        setSavedCurrentUser({ id: currentUserId, email: currentUserEmail, isLocalOnly: true });
        loggedIn = true;
      } else {
        renderLoginScreen('Incorrect password. Please try again.', 'login');
        return;
      }
    }

    if(!loggedIn){
      renderLoginScreen('No account found with this email. Click "Create new account" to start instantly!', 'login');
      return;
    }

    document.getElementById('loginRoot').innerHTML = '';
    document.getElementById('app').style.display = '';
    await startApp();
  }

  async function handleLogout(){
    if(sb) try{ await sb.auth.signOut(); }catch(e){}
    setSavedCurrentUser(null);
    currentUserId = null;
    currentUserEmail = null;
    settingsModal = null;
    clearInterval(reminderCheckInterval);
    document.getElementById('app').style.display = 'none';
    renderLoginScreen('', 'login');
  }

  document.addEventListener('click', (e) => {
    if(e.target.id === 'loginBtn') handleLogin();
    if(e.target.id === 'logoutBtn') handleLogout();
    if(e.target.id === 'createLinkBtn') renderLoginScreen('', 'signup');
    if(e.target.id === 'signupBtn') handleSignup();
    if(e.target.id === 'forgotLinkBtn') renderLoginScreen('', 'forgot');
    if(e.target.id === 'backToLoginBtn') renderLoginScreen('', 'login');
    if(e.target.id === 'forgotBtn') handleForgot();
    if(e.target.id === 'resetBtn') handleReset();
    if(e.target.id === 'topLogoutBtn') handleLogout();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && (e.target.id === 'loginEmail' || e.target.id === 'loginPassword')){
      const md = document.getElementById('loginRoot').dataset.mode;
      if(md === 'forgot') handleForgot(); else if(md === 'signup') handleSignup(); else handleLogin();
    }
    if(e.key === 'Enter' && e.target.id === 'resetPassword'){
      handleReset();
    }
  });

  document.addEventListener('change', async (e) => {
    if(e.target.id === 'adminSelfTierSelect'){
      data.plan = e.target.value;
      scheduleSave();
      renderAdminModal();
      renderTopNav();
      renderPage();
      if(typeof drToast === 'function') drToast('Active plan set to ' + data.plan.toUpperCase());
    }
    if(e.target.matches('[data-admin-user-tier]')){
      const targetEmail = e.target.getAttribute('data-admin-user-tier');
      const newTier = e.target.value;
      if(sb){
        try {
          await sb.from('admin_user_profiles').upsert({
            email: targetEmail.toLowerCase(),
            tier: newTier,
            updated_at: new Date().toISOString()
          }, { onConflict: 'email' });
        } catch(err){
          console.warn('Could not update remote tier:', err);
        }
      }
      const localUsers = getLocalUsers();
      if(localUsers[targetEmail.toLowerCase()]){
        localUsers[targetEmail.toLowerCase()].plan = newTier;
        localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(localUsers));
      }
      if(currentUserEmail && targetEmail.toLowerCase() === currentUserEmail.toLowerCase()){
        data.plan = newTier;
        scheduleSave();
        renderTopNav();
        renderPage();
      }
      const found = cachedAdminUsers.find(u => u.email.toLowerCase() === targetEmail.toLowerCase());
      if(found) found.tier = newTier;
      updateAdminStatsUI(cachedAdminUsers);
      if(typeof drToast === 'function') drToast(`Updated ${targetEmail} to ${newTier.toUpperCase()}`);
    }
  });

  document.addEventListener('input', (e) => {
    if(e.target.id === 'adminUserSearch'){
      adminSearchQuery = e.target.value.trim();
      renderAdminUserRows(cachedAdminUsers);
    }
  });

  let reminderCheckInterval = null;
  async function startApp(){
    data = await loadData();
    if(sb && currentUserEmail){
      try {
        const { data: prof, error } = await sb.from('admin_user_profiles').select('tier').eq('email', currentUserEmail.toLowerCase()).maybeSingle();
        if(!error && prof && prof.tier && prof.tier !== data.plan){
          data.plan = prof.tier;
          scheduleSave();
        }
      } catch(e){}
    }
    applyTheme();
    renderBottomNav();
    renderPage();
    checkAutoReports();
    clearInterval(reminderCheckInterval);
    reminderCheckInterval = setInterval(checkReminder, 15000);
    drInit();
  }

  (async function init(){
    if(/type=recovery/.test(location.hash)){
      renderLoginScreen('', 'reset');
      return;
    }
    // 1. Check Supabase session
    if(sb){
      try {
        const { data: sessionData } = await sb.auth.getSession();
        if(sessionData && sessionData.session && sessionData.session.user){
          currentUserId = sessionData.session.user.id;
          currentUserEmail = sessionData.session.user.email || null;
          setSavedCurrentUser({ id: currentUserId, email: currentUserEmail, isLocalOnly: false });
          document.getElementById('app').style.display = '';
          await startApp();
          return;
        }
      } catch(e){}
    }
    // 2. Check saved user in localStorage
    const savedUser = getSavedCurrentUser();
    if(savedUser && savedUser.id && savedUser.email){
      currentUserId = savedUser.id;
      currentUserEmail = savedUser.email;
      document.getElementById('app').style.display = '';
      await startApp();
      return;
    }
    // 3. Show clean login screen
    renderLoginScreen('', 'login');

    if(sb){
      sb.auth.onAuthStateChange((event) => {
        if(event === 'PASSWORD_RECOVERY'){ renderLoginScreen('', 'reset'); return; }
        if(event === 'SIGNED_OUT'){
          currentUserId = null;
          currentUserEmail = null;
          setSavedCurrentUser(null);
          document.getElementById('app').style.display = 'none';
          renderLoginScreen('', 'login');
        }
      });
    }
  })();
})();
</script>
  <div id="pricingModalRoot"></div>
  <div id="adminModalRoot"></div>
</body>
</html>
